aid: trade-republic
name: Trade Republic
description: >-
  Trade Republic is a Berlin-based digital bank and Europe's largest savings
  platform, offering commission-optimized trading of stocks, ETFs, derivatives,
  and crypto, ETF and stock savings plans, interest on uninvested cash, and a
  Visa card. Trade Republic Bank GmbH holds a full German banking license and
  serves customers across European markets. The company publishes no public
  developer API, API documentation, or first-party SDKs — its mobile and web
  apps run on a private WebSocket-based backend (api.traderepublic.com) that a
  community ecosystem of unofficial clients has grown around.
